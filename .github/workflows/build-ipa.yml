name: Build unsigned IPA

# Builds NetScope on a macOS runner and publishes an unsigned .ipa as an
# artifact. The IPA cannot be installed as-is: sign it locally with Sideloadly
# or AltStore using your own Apple ID.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: netscope-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The exact Xcode versions on the runner image change over time, so the
      # newest installed one is picked at run time instead of being hardcoded.
      - name: Select newest Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using $NEWEST"
          sudo xcode-select -switch "$NEWEST/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project NetScope.xcodeproj \
            -scheme NetScope \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tee xcodebuild.log

      - name: Package into an IPA
        run: |
          set -euo pipefail
          test -d build/Build/Products/Release-iphoneos/NetScope.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NetScope.app Payload/
          zip -qry NetScope.ipa Payload
          ls -lh NetScope.ipa

      - name: Validate IPA
        run: |
          set -euo pipefail
          unzip -t NetScope.ipa
          unzip -l NetScope.ipa | grep -q 'Payload/NetScope.app/NetScope'
          plutil -lint Payload/NetScope.app/Info.plist
          echo "IPA_SHA256=$(shasum -a 256 NetScope.ipa | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build summary
        run: |
          {
            echo "## NetScope IPA"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- SHA-256: \`$IPA_SHA256\`"
            echo "- Install: sign the downloaded IPA with Sideloadly, AltStore or your signing service."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request'
        with:
          name: NetScope-unsigned-ipa
          path: NetScope.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
